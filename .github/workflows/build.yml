# Builds every push and pull request; a v* tag also publishes a GitHub release.
# The game's DLLs cannot be public, so the build compiles against signature
# only copies from the private repo NeutralQoL-refs (made by tools/refs.py),
# checked out with the REFS_TOKEN secret. Pull requests from forks get no
# secrets and skip the build with a notice.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REFS_REPO: DevHrytsan/NeutralQoL-refs
  # Directory.Build.props reads the game folder from NO_GAME_PATH.
  NO_GAME_PATH: ${{ github.workspace }}\refs
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # The private source repo carries this file too; only the public repo builds and releases.
    if: github.repository == 'DevHrytsan/NeutralQoL'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      REFS_TOKEN: ${{ secrets.REFS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip without reference assemblies
        if: env.REFS_TOKEN == ''
        run: echo "::notice::REFS_TOKEN is not available (pull request from a fork?), build skipped."

      - name: Check out reference assemblies
        if: env.REFS_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REFS_REPO }}
          token: ${{ env.REFS_TOKEN }}
          path: refs

      - uses: actions/setup-dotnet@v4
        if: env.REFS_TOKEN != ''
        with:
          global-json-file: global.json

      - name: Build
        if: env.REFS_TOKEN != '' && !startsWith(github.ref, 'refs/tags/')
        run: dotnet build src/NeutralQoL/NeutralQoL.csproj -c Release -v:minimal

      - name: Check tag matches version
        if: env.REFS_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content -Raw src/NeutralQoL/NeutralQoL.csproj), '<Version>([^<]+)</Version>').Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            echo "::error::tag ${{ github.ref_name }} does not match <Version>$version</Version> in NeutralQoL.csproj"
            exit 1
          }

      - name: Package
        if: env.REFS_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $gameVersion = (Get-Content refs/game-version.txt -TotalCount 1).Trim()
          python tools/package.py --game-version $gameVersion --owner "${{ github.repository_owner }}" --repo "${{ github.event.repository.name }}"

      - name: Publish release
        if: env.REFS_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/NeutralQoL.zip dist/NeutralQoL.json --title "${{ github.ref_name }}" --generate-notes

      - name: Upload build
        if: env.REFS_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: NeutralQoL
          path: src/NeutralQoL/bin/Release/NeutralQoL.dll
